name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  statik:
    name: Statik denetim (sözdizimi, isim çakışması, bağlantılar)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install tree-sitter-language-pack
      - run: |
          python araclar/dart_sozdizimi.py | tee /tmp/s && grep -q 'hatali dosya: 0' /tmp/s
      - run: |
          python araclar/dart_cakisma.py | tee /tmp/c && grep -q 'sorun: 0' /tmp/c
      - run: |
          python araclar/dart_baglanti.py | tee /tmp/b && grep -q 'sorun: 0' /tmp/b
      - run: |
          python araclar/dart_parametre.py | tee /tmp/p && grep -q 'sorun: 0' /tmp/p

  cekirdek:
    name: Çekirdek paket (Dart)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/hukuk_cekirdek
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart analyze --fatal-infos
      - run: dart test

  sunucu:
    name: Uygulama sunucusu (Dart)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/sunucu
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart analyze
      - run: dart test

  portal:
    name: Portal uygulaması (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/portal
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Platform klasörlerini üret
        run: flutter create . --project-name portal --org tr.hukukportali --platforms=web
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web

  web-onizleme:
    # Analiz uyarıları yayını durdurmasın: demo verisiyle çalışan web sürümü ayrı derlenir ve indirilebilir paket olur.
    # Sunucu adresi verilmez; yalnızca tarayıcıdaki demo verisi kullanılır, gerçek müvekkil verisi yoktur.
    name: Web önizleme (demo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/portal
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create . --project-name portal --org tr.hukukportali --platforms=web
      - run: flutter pub get
      - run: flutter build web --release --no-web-resources-cdn
      - name: Göreli adrese çevir (herhangi bir klasörden açılabilsin)
        run: sed -i 's|<base href="/">|<base href="./">|' build/web/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: web-demo
          path: apps/portal/build/web
          retention-days: 14

  belge:
    name: Belge servisi (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/belge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-tur poppler-utils
      - run: pip install -r requirements-test.txt
      - run: python -m pytest -q

  veritabani:
    name: Veritabanı şeması (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend/veritabani
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install "psycopg[binary]" pytest tree-sitter-language-pack
      - run: python -m pytest -q
        env:
          PG_DSN: host=localhost port=5432 user=postgres password=test
      - name: Göç uygulayıcı boş veritabanında çalışıyor mu
        run: |
          psql "host=localhost port=5432 user=postgres password=test" -c "CREATE DATABASE goc_deneme"
          PG_DSN="host=localhost port=5432 user=postgres password=test dbname=goc_deneme" python goc.py
          PG_DSN="host=localhost port=5432 user=postgres password=test dbname=goc_deneme" python goc.py --kontrol
      - name: Sunucudaki SQL metinlerini şemaya karşı PREPARE et
        run: python ../../araclar/sql_denetim.py "host=localhost port=5432 user=postgres password=test"
