name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cekirdek:
    name: Çekirdek paket (Dart)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/hukuk_cekirdek
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart analyze --fatal-infos
      - run: dart test

  portal:
    name: Portal uygulaması (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/portal
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Platform klasörlerini üret
        run: flutter create . --project-name portal --org tr.hukukportali --platforms=web
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web
