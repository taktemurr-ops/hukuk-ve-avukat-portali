name: portal
description: Hukuk ve Avukat Portalı - web, mobil ve masaüstü uygulaması.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  hukuk_cekirdek:
    path: ../../packages/hukuk_cekirdek
  http: ^1.2.2
  # Ödeme sayfasını (ödeme kuruluşunun sitesi) tarayıcıda açmak için.
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  # Fontlar uygulamaya gömülüdür; çalışma anında dışarıdan font indirilmez (yurt içi veri kuralı).
  # Lisans: SIL Open Font License 1.1 (assets/fonts/OFL-*.txt)
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
          weight: 400
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700
    - family: SourceSerif4
      fonts:
        - asset: assets/fonts/SourceSerif4-600.ttf
          weight: 600
        - asset: assets/fonts/SourceSerif4-700.ttf
          weight: 700
